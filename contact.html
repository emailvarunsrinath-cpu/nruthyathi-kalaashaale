  <style>
    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      background-color: #f9f5f0;
      color: #2d241e;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      overflow-x: hidden;
      width: 100%;
    }

    h1, h2, h3, .royal-font { font-family: 'Playfair Display', serif; }

    ::selection { background: #d4af37; color: #ffffff; }

    /* Section eyebrow / kicker */
    .kicker {
      color: #d4af37;
      font-weight: 700;
      letter-spacing: 0.35em;
      font-size: 0.68rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.9rem;
    }

    .section-divider {
      height: 1px;
      width: 6rem;
      margin: 1.5rem auto 0;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      opacity: 0.8;
    }

    /* CINEMATIC HERO */
    .hero-section {
      position: relative;
      height: 100vh;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1a0303;
    }
    .hero-section::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(10,2,2,0.45), rgba(10,2,2,0.7)), url('images/RAW05165.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      animation: slowPan 25s infinite alternate;
      z-index: 1;
    }
    @keyframes slowPan { from { transform: scale(1); } to { transform: scale(1.1); } }
    @media (max-width: 768px) { .hero-section::before { background-attachment: scroll; } }

    /* GOLDEN ELEMENTS */
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-left: 4px solid #d4af37;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
    }

    .btn-royal {
      background: linear-gradient(135deg, #d4af37 0%, #aa8a2e 100%);
      color: white;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .btn-royal:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(212, 175, 55, 0.4); }

    .btn-outline {
      border: 1px solid rgba(74,4,4,0.25);
      color: #4a0404;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      transition: all 0.35s ease;
    }
    .btn-outline:hover { background: #4a0404; color: #fff; border-color: #4a0404; }

    /* CARDS: Workshops / Achievements */
    .info-card {
      background: #ffffff;
      border-radius: 1.5rem;
      border: 1px solid rgba(212,175,55,0.18);
      box-shadow: 0 20px 40px -20px rgba(74,4,4,0.15);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .info-card:hover { transform: translateY(-6px); box-shadow: 0 28px 50px -18px rgba(74,4,4,0.22); }

    .icon-badge {
      width: 3.25rem; height: 3.25rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 999px;
      background: linear-gradient(135deg, #fff8e8, #f3e6c0);
      color: #aa8a2e;
      font-size: 1.1rem;
    }

    /* AUTOMATED GALLERY */
    .gallery-outer {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      aspect-ratio: 16/9;
      border-radius: 1rem;
      overflow: hidden;
      border: 8px solid #fff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .mySlide { display: none; width: 100%; height: 100%; object-fit: cover; }
    .active-slide { display: block !important; animation: fadeInScale 1s ease-in-out; }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }

    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 1.5rem; }
    .dot { width: 8px; height: 8px; border-radius: 999px; background: #e4d6b8; transition: all 0.3s ease; cursor: pointer; }
    .dot.active-dot { background: #d4af37; width: 22px; }

    /* MOBILE NAVIGATION */
    #navMenu.show {
      display: flex !important; flex-direction: column; position: absolute;
      top: 100%; left: 0; width: 100%; background: #ffffff;
      padding: 2.5rem; gap: 2rem; border-bottom: 4px solid #d4af37;
    }

    /* LIGHTBOX */
    #lightbox {
      display: none; position: fixed; z-index: 9999;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 5, 0.98); flex-direction: column;
      justify-content: center; align-items: center;
    }
    #lightbox img { max-width: 95vw; max-height: 80vh; object-fit: contain; border: 2px solid #d4af37; }

    /* LOGO STYLING */
    .nav-logo {
        height: 62px;
        width: auto;
        display: block;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
        transition: transform 0.3s ease;
    }
    .nav-logo:hover { transform: scale(1.03); }
    .nav-logo-container {
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
        z-index: 20;
    }

    /* RANGAPRAVESHA YEAR TABS */
    .rp-tab {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #b8a68e;
      background: transparent;
      border: 1px solid rgba(74,4,4,0.15);
      padding: 0.6rem 1.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .rp-tab:hover { color: #4a0404; border-color: rgba(212,175,55,0.5); }
    .rp-tab.rp-active {
      color: #fff;
      background: linear-gradient(135deg, #d4af37 0%, #aa8a2e 100%);
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(212,175,55,0.35);
    }
    .rp-panel { display: none; }
    .rp-panel.rp-active { display: block; animation: fadeInScale 0.6s ease; }

    .badge-pill {
      display: inline-block;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }
  </style>

<script>
    // Navigation
    function toggleMobileMenu() {
      const menu = document.getElementById('navMenu');
      menu.classList.toggle('hidden');
      menu.classList.toggle('show');
    }
    function closeMenu() {
      const menu = document.getElementById('navMenu');
      menu.classList.add('hidden');
      menu.classList.remove('show');
    }

    // Automatic Slideshow with dots
    let slideIndex = 0;
    const slides = document.getElementsByClassName("mySlide");
    const dotsContainer = document.getElementById('dots');
    slides.length && Array.from(slides).forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i === 0 ? ' active-dot' : '');
      d.onclick = (e) => { e.stopPropagation(); goToSlide(i); };
      dotsContainer.appendChild(d);
    });
    function updateDots() {
      Array.from(dotsContainer.children).forEach((d, i) => d.classList.toggle('active-dot', i === slideIndex - 1));
    }
    function goToSlide(i) {
      for (let j = 0; j < slides.length; j++) slides[j].classList.remove('active-slide');
      slideIndex = i + 1;
      slides[i].classList.add('active-slide');
      updateDots();
    }
    function runSlideshow() {
      for (let i = 0; i < slides.length; i++) slides[i].classList.remove('active-slide');
      slideIndex++;
      if (slideIndex > slides.length) slideIndex = 1;
      slides[slideIndex-1].classList.add('active-slide');
      updateDots();
      setTimeout(runSlideshow, 5000);
    }

    // Lightbox & Swiping
    let currentIdx = 0;
    let startX = 0;
    function openLightbox() {
      currentIdx = slideIndex - 1;
      updateLightbox();
      document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }
    function changeImage(n) {
      currentIdx = (currentIdx + n + slides.length) % slides.length;
      updateLightbox();
    }
    function updateLightbox() { document.getElementById('lightbox-img').src = slides[currentIdx].src; }

    const lbImg = document.getElementById('lightbox-img');
    lbImg.addEventListener('touchstart', e => startX = e.touches[0].clientX);
    lbImg.addEventListener('touchend', e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) changeImage(1);
      if (endX - startX > 50) changeImage(-1);
    });
    document.addEventListener('keydown', e => {
      if (document.getElementById('lightbox').style.display !== 'flex') return;
      if (e.key === 'ArrowRight') changeImage(1);
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'Escape') closeLightbox();
    });

    // Rangapravesha year tabs
    function initRangapravesha() {
      const tabs = document.querySelectorAll('.rp-tab');
      const panels = document.querySelectorAll('.rp-panel');
      if (!tabs.length) return;
      function activate(year) {
        tabs.forEach(t => t.classList.toggle('rp-active', t.dataset.year === year));
        panels.forEach(p => p.classList.toggle('rp-active', p.dataset.year === year));
      }
      tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.year)));
      // Default to the most recent year available
      const years = Array.from(tabs).map(t => t.dataset.year).sort().reverse();
      activate(years[0]);
    }

    // Press coverage dropdown
    function togglePress() {
      const grid = document.getElementById('pressGrid');
      const icon = document.getElementById('pressToggleIcon');
      const label = document.getElementById('pressToggleLabel');
      const isHidden = grid.style.display === 'none';
      grid.style.display = isHidden ? 'grid' : 'none';
      icon.classList.toggle('fa-chevron-down', !isHidden);
      icon.classList.toggle('fa-chevron-up', isHidden);
      label.textContent = isHidden ? 'Hide Press Coverage' : 'View Press Coverage (11)';
      if (isHidden) {
        setTimeout(() => document.getElementById('pressToggleBtn').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      }
    }

    window.onload = () => { AOS.init({ once: true, duration: 900 }); runSlideshow(); initRangapravesha(); };
  </script>
